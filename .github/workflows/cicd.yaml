
name: Deploy MediRAG AI to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: medirag-ai
      AWS_ACCOUNT_ID: "136311626773"
      EC2_INSTANCE_ID: "i-07c7d0050c021b902"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy image through AWS SSM
        env:
          IMAGE_URI: ${{ steps.build.outputs.image }}
        run: |
          python3 - <<'PY'
          import json
          import os

          image = os.environ["IMAGE_URI"]
          region = os.environ["AWS_REGION"]
          registry = f'136311626773.dkr.ecr.{region}.amazonaws.com'

          commands = [
              "set -e",
              f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {registry}",
              f"docker pull {image}",
              "docker stop medirag-ai || true",
              "docker rm medirag-ai || true",
              f"docker run -d --name medirag-ai --restart unless-stopped --env-file /home/ec2-user/medirag/.env -e FLASK_DEBUG=0 -p 80:8080 {image} gunicorn --workers 1 --bind 0.0.0.0:8080 --access-logfile - --error-logfile - app:app",
              "for i in $(seq 1 20); do if curl -fsS http://127.0.0.1/ >/dev/null; then echo 'Health check passed'; exit 0; fi; sleep 5; done",
              "docker logs --tail 100 medirag-ai",
              "exit 1"
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --comment "Deploy MediRAG AI from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
